<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" shape-rendering="crispEdges">
  <!-- Background -->
  <rect width="24" height="24" fill="#FDF6D8" />
  
  <!-- Robot Head Outline -->
  <rect x="5" y="4" width="14" height="16" fill="#334155" />
  
  <!-- Robot Face Inner -->
  <rect x="6" y="5" width="12" height="14" fill="#94A3B8" />
  
  <!-- Eyes -->
  <rect x="8" y="9" width="3" height="3" fill="#0EA5E9" />
  <rect x="13" y="9" width="3" height="3" fill="#0EA5E9" />
  
  <!-- Pupils/Glint -->
  <rect x="9" y="9" width="1" height="1" fill="#FFFFFF" />
  <rect x="14" y="9" width="1" height="1" fill="#FFFFFF" />
  
  <!-- Mouth -->
  <rect x="8" y="15" width="8" height="2" fill="#334155" />
  
  <!-- Antenna -->
  <rect x="11" y="2" width="2" height="2" fill="#334155" />
  <rect x="11" y="1" width="2" height="1" fill="#EF4444" />
  
  <!-- Ears/Bolts -->
  <rect x="4" y="10" width="1" height="4" fill="#64748B" />
  <rect x="19" y="10" width="1" height="4" fill="#64748B" />
</svg>
