<svg
  xmlns="http://www.w3.org/2000/svg"
  width="256"
  height="256"
  viewBox="0 0 16 16"
  shape-rendering="crispEdges"
>
  <rect width="16" height="16" fill="#f1f5f9" />

  <!-- Antenna -->
  <rect x="7" y="0" width="1" height="1" fill="#ef4444" />
  <rect x="7" y="1" width="1" height="1" fill="#0f172a" />
  <rect x="8" y="1" width="1" height="1" fill="#0f172a" />
  <rect x="7" y="2" width="1" height="1" fill="#0f172a" />
  <rect x="8" y="2" width="1" height="1" fill="#0f172a" />

  <!-- Head outline -->
  <rect x="4" y="3" width="8" height="1" fill="#0f172a" />
  <rect x="3" y="4" width="1" height="6" fill="#0f172a" />
  <rect x="12" y="4" width="1" height="6" fill="#0f172a" />
  <rect x="4" y="10" width="8" height="1" fill="#0f172a" />

  <!-- Face -->
  <rect x="4" y="4" width="8" height="6" fill="#0ea5e9" />
  <rect x="5" y="4" width="6" height="1" fill="#38bdf8" />
  <rect x="5" y="9" width="6" height="1" fill="#0284c7" />

  <!-- Eyes -->
  <rect x="6" y="6" width="1" height="1" fill="#0f172a" />
  <rect x="9" y="6" width="1" height="1" fill="#0f172a" />
  <rect x="6" y="5" width="1" height="1" fill="#f8fafc" />
  <rect x="9" y="5" width="1" height="1" fill="#f8fafc" />

  <!-- Mouth -->
  <rect x="7" y="8" width="2" height="1" fill="#0f172a" />

  <!-- Body -->
  <rect x="5" y="11" width="6" height="5" fill="#0f172a" />
  <rect x="5" y="11" width="6" height="1" fill="#1f2937" />

  <!-- "H" mark -->
  <rect x="6" y="12" width="1" height="3" fill="#f8fafc" />
  <rect x="9" y="12" width="1" height="3" fill="#f8fafc" />
  <rect x="7" y="13" width="2" height="1" fill="#f8fafc" />
</svg>

